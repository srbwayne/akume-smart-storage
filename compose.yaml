services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: akume_storage
      POSTGRES_USER: akume
      POSTGRES_PASSWORD: akume_local
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akume -d akume_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
