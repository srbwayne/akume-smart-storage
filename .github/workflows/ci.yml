name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: akume_storage
          POSTGRES_USER: akume
          POSTGRES_PASSWORD: akume_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akume -d akume_storage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/akume_storage
          DB_USERNAME: akume
          DB_PASSWORD: akume_local
        run: ./mvnw test
      - name: Verify backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/akume_storage
          DB_USERNAME: akume
          DB_PASSWORD: akume_local
        run: ./mvnw verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build
